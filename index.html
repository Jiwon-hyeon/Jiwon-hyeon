
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Household Ledger</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>

  <!-- 로그인 화면 -->
  <section id="loginScreen" class="login-screen">

    <div class="login-box">

      <div class="lock-icon">🔒</div>

      <h1>My Ledger</h1>

      <p>가계부에 접속하려면 비밀번호를 입력하세요.</p>

      <form id="loginForm">

        <input
          type="password"
          id="passwordInput"
          maxlength="4"
          inputmode="numeric"
          autocomplete="current-password"
          placeholder="비밀번호 4자리"
          required
        >

        <button type="submit">로그인</button>

        <p id="loginError" class="login-error"></p>

      </form>

    </div>

  </section>


  <!-- 가계부 메인 화면 -->
  <main class="container" id="ledgerApp" hidden>

    <!-- 제목 -->
    <header>
      <h1>My Household Ledger</h1>
      <p>나의 수입과 지출을 한눈에 관리하세요.</p>
    </header>


    <!-- 기간 선택 -->
    <section class="month-area">

      <button type="button" id="prevPeriod">◀</button>

      <span id="currentPeriod">전체 기간</span>

      <button type="button" id="nextPeriod">▶</button>

      <button type="button" id="monthView">
        월별 보기
      </button>

      <button type="button" id="yearView">
        연도별 보기
      </button>

      <button type="button" id="allMonths">
        전체 기간
      </button>

    </section>


    <!-- 수입 / 지출 합계 -->
    <section class="summary">

      <div class="summary-card income">
        <h3>총 수입</h3>
        <p id="totalIncome">0원</p>
      </div>

      <div class="summary-card expense">
        <h3>총 지출</h3>
        <p id="totalExpense">0원</p>
      </div>

      <div class="summary-card balance">
        <h3>잔액</h3>
        <p id="totalBalance">0원</p>
      </div>

    </section>


    <!-- 내역 입력 -->
    <section class="form-section">

      <h2>내역 등록</h2>

      <form id="ledgerForm">

        <div class="form-grid">

          <div>
            <label for="type">구분</label>

            <select id="type" required>
              <option value="expense">지출</option>
              <option value="income">수입</option>
            </select>
          </div>


          <div>
            <label for="date">날짜</label>

            <input
              type="date"
              id="date"
              required
            >
          </div>


          <div>
            <label for="category">카테고리</label>

            <select id="category" required>

              <optgroup label="지출">
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="쇼핑">쇼핑</option>
                <option value="생활">생활</option>
                <option value="주거">주거</option>
                <option value="의료">의료</option>
                <option value="문화">문화</option>
                <option value="통신">통신</option>
                <option value="교육">교육</option>
              </optgroup>

              <optgroup label="수입">
                <option value="급여">급여</option>
                <option value="상여금">상여금</option>
                <option value="부수입">부수입</option>
                <option value="이자">이자</option>
              </optgroup>

              <option value="기타">기타</option>

            </select>
          </div>


          <div>
            <label for="amount">금액</label>

            <input
              type="number"
              id="amount"
              min="1"
              step="1"
              placeholder="금액 입력"
              required
            >
          </div>


          <div class="full-width">
            <label for="memo">메모</label>

            <input
              type="text"
              id="memo"
              placeholder="메모를 입력하세요."
            >
          </div>

        </div>


        <button
          type="submit"
          id="submitBtn"
          class="add-btn"
        >
          내역 추가하기
        </button>


        <button
          type="button"
          id="cancelEdit"
          class="cancel-btn"
          hidden
        >
          수정 취소
        </button>

      </form>

    </section>


    <!-- 거래 내역 -->
    <section class="list-section">

      <div class="list-header">

        <h2>거래 내역</h2>

        <select id="filter">

          <option value="all">전체 내역</option>

          <option value="income">수입만 보기</option>

          <option value="expense">지출만 보기</option>

        </select>

      </div>


      <div id="transactionList"></div>

    </section>


    <!-- 하단 -->
    <footer>
      <p>My Household Ledger</p>
    </footer>

  </main>

</body>
</html>
