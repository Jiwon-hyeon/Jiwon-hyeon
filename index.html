
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 가계부</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>My Household Ledger</h1>
    <p>가계부에 접속하려면 비밀번호를 입력하세요.</p>

    <form id="loginForm">
      <input
        type="password"
        id="passwordInput"
        placeholder="비밀번호 4자리"
        maxlength="4"
        inputmode="numeric"
        required
      >
      <button type="submit">로그인</button>
      <p id="loginError"></p>
    </form>
  </div>
</div>
  
<div class="container" id="ledgerApp" hidden>
    <header>
      <h1>My Household Ledger</h1>
      <p>나의 소중한 돈 관리</p>
    </header>

    <section class="month-area">
      <button id="prevMonth">❮</button>
      <h2 id="currentMonth"></h2>
      <button id="nextMonth">❯</button>
    </section>

    <section class="summary">
      <div class="summary-card income">
        <span>이번 달 수입</span>
        <strong id="totalIncome">0원</strong>
      </div>

      <div class="summary-card expense">
        <span>이번 달 지출</span>
        <strong id="totalExpense">0원</strong>
      </div>

      <div class="summary-card balance">
        <span>이번 달 잔액</span>
        <strong id="totalBalance">0원</strong>
      </div>
    </section>

    <section class="form-section">
      <h2>내역 추가</h2>

      <form id="ledgerForm">
        <div class="form-grid">

          <div>
            <label>구분</label>
            <select id="type">
              <option value="expense">지출</option>
              <option value="income">수입</option>
            </select>
          </div>

          <div>
            <label>날짜</label>
            <input type="date" id="date" required>
          </div>

          <div>
            <label>카테고리</label>
            <select id="category">
              <option value="식비">식비</option>
              <option value="교통">교통</option>
              <option value="쇼핑">쇼핑</option>
              <option value="생활">생활</option>
              <option value="주거">주거</option>
              <option value="의료">의료</option>
              <option value="문화">문화</option>
              <option value="급여">급여</option>
              <option value="부수입">부수입</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <div>
            <label>금액 (원)</label>
            <input
              type="number"
              id="amount"
              min="1"
              step="1"
              placeholder="금액 입력"
              required
            >
          </div>

          <div class="full-width">
            <label>내용</label>
            <input
              type="text"
              id="memo"
              placeholder="예: 점심 식사, 월급"
              maxlength="100"
            >
          </div>

        </div>

        <button type="submit" class="add-btn" id="submitBtn">
          내역 추가하기
        </button>
        <button type="button" class="cancel-btn" id="cancelEdit" hidden>
          수정 취소
        </button>
      </form>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>거래 내역</h2>

        <select id="filter">
          <option value="all">전체 내역</option>
          <option value="income">수입만 보기</option>
          <option value="expense">지출만 보기</option>
        </select>
      </div>

      <div id="transactionList"></div>
    </section>

    <footer>
      <p>My Household Ledger © 2026</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
