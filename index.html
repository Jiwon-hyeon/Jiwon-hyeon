<body>

  <!-- 비밀번호 화면 -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>My Household Ledger</h1>
      <p>비밀번호를 입력하세요.</p>

      <form id="loginForm">
        <input
          type="password"
          id="passwordInput"
          placeholder="비밀번호 입력"
          maxlength="4"
          required
        >
        <button type="submit">로그인</button>
        <p id="loginError"></p>
      </form>
    </div>
  </div>

  <!-- 가계부 전체 화면 -->
  <div class="container" id="ledgerApp" hidden>

    <!-- 기존 header부터 가계부 내용 전부 -->

  </div>

  <script src="script.js"></script>
</body>
